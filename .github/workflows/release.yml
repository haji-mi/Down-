name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Binary for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: DownloadCleaner-windows-x64.zip
            asset_name: DownloadCleaner-v2.4.0-Windows-x64.zip
          - os: macos-latest
            artifact_name: DownloadCleaner-macos-universal.zip
            asset_name: DownloadCleaner-v2.4.0-macOS-Universal.zip
          - os: ubuntu-latest
            artifact_name: DownloadCleaner-linux-x64.tar.gz
            asset_name: DownloadCleaner-v2.4.0-Linux-x64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Run Build Script
        run: python build_release.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: releases/*
